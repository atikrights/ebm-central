# Force Trigger: v7.5 CI/CD Stabilization
name: 🚀 EBM Central Ecosystem Master Release (Final Resilience)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  # 🌐 ওয়েব ডিপ্লয়মেন্ট
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: 🏗️ Build Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/" --dart-define=API_URL=https://api.ebfic.store
      - name: 📤 Upload via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          source: "build/web/*"
          target: "domains/ebfic.store/public_html/central"
          strip_components: 2

  # 🤖 অ্যান্ড্রয়েড বিল্ড
  build-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: 📦 Build APK & AAB
        run: |
          flutter pub get
          flutter clean
          flutter build apk --release --dart-define=API_URL=https://api.ebfic.store
          flutter build appbundle --release --dart-define=API_URL=https://api.ebfic.store
        continue-on-error: true
        
      - name: 📂 Force Collect Releases
        run: |
          mkdir -p release_assets
          find . -name "*.apk" -type f -exec cp {} release_assets/ \;
          find . -name "*.aab" -type f -exec cp {} release_assets/ \;

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release_assets/*
          name: "EBM Central Update ${{ github.ref_name }}"
          body: |
            🚀 **EBM Central Official Release — ${{ github.ref_name }}**
            
            ### 📝 What's New:
            - Latest updates, stability improvements & performance boosts.
            - Cross-platform sync via secure HTTPS API architecture.
            
            ### 📥 Installation Guide:
            **🤖 Android Users:**
            1. Download the `app-release.apk` file below.
            2. Open it and tap **Install** (enable "Unknown Sources" if prompted).
            3. The `.aab` file is for Google Play Store uploads only.
            
            **🖥️ Windows PC Users:**
            1. Download `EBM_Central_Windows.zip` below.
            2. Extract/Unzip the folder anywhere on your PC.
            3. Open the extracted folder and run the `.exe` file inside.
            
            ---
            👨‍💻 **Developed & Architected by: Atik Islam**
            *EBM Ecosystem — Enterprise CI/CD Pipeline*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🪟 উইন্ডোজ বিল্ড
  build-windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: 🪟 Build Windows
        run: |
          flutter pub get
          flutter build windows --release --dart-define=API_URL=https://api.ebfic.store
      
      - name: 📂 Package Windows Build
        run: |
          mkdir release_assets
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release_assets\EBM_Central_Windows.zip
        shell: powershell

      - name: 📤 Upload Windows ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release_assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
