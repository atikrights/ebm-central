name: 🚀 Deploy EBM Central Web → central.ebfic.com (SSH)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: 🏗️ Build Web
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_URL=https://api.ebfic.store

      - name: 📤 Upload to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          source: "build/web/*"
          target: "public_html/central"
          strip_components: 2
