name: 🚀 Deploy EBM Central Web → central.ebfic.com

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 🏗️ Build Flutter Web (Release)
        run: |
          flutter build web \
            --release \
            --web-renderer canvaskit \
            --dart-define=API_URL=https://api.ebfic.store

      - name: 📤 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/central/
          local-dir: ./build/web/

      - name: ✅ Deploy Complete
        run: echo "✅ EBM Central Web deployed to central.ebfic.com successfully!"
