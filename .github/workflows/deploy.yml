name: 🚀 Deploy EBM Central Web (SSH) + Android & Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  # 🌐 ওয়েব ডিপ্লয়মেন্ট
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: 🏗️ Build Web
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_URL=https://api.ebfic.store
      - name: 📤 Upload via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 65002 }}
          timeout: 120s
          source: "build/web/*"
          target: "domains/ebfic.com/public_html"
          strip_components: 2

  # 🤖 অ্যান্ড্রয়েড এবং উইন্ডোজ বিল্ড
  build-android-windows:
    name: 🤖 Android & Windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: 📦 Get Deps
        run: flutter pub get
      - name: 🤖 Build APK (Debug/Unsigned)
        run: flutter build apk --debug --dart-define=API_URL=https://api.ebfic.store
      - name: 🪟 Build Windows
        run: flutter build windows --release --dart-define=API_URL=https://api.ebfic.store
      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/windows/x64/runner/Release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
