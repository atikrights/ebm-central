name: 🚀 EBM Central Ecosystem Master Release (Final Resilience)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  # 🌐 ওয়েব ডিপ্লয়মেন্ট
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: 🏗️ Build Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/" --dart-define=API_URL=https://api.ebfic.store
      - name: 📤 Upload via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          source: "build/web/*"
          target: "domains/ebfic.store/public_html/central"
          strip_components: 2

  # 🤖 অ্যান্ড্রয়েড বিল্ড
  build-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: 📦 Build APK
        run: |
          flutter pub get
          flutter clean
          flutter build apk --debug --dart-define=API_URL=https://api.ebfic.store --suppress-analytics --no-tree-shake-icons
        continue-on-error: true
        
      - name: 📂 Force Collect APKs
        run: |
          mkdir -p release_assets
          find . -name "*.apk" -type f -exec cp {} release_assets/ \;

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🪟 উইন্ডোজ বিল্ড
  build-windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: 🪟 Build Windows
        run: |
          flutter pub get
          flutter build windows --release --dart-define=API_URL=https://api.ebfic.store
      
      - name: 📂 Force Collect Windows
        run: |
          mkdir release_assets
          dir /s /b *.exe > exe_list.txt
          for /f "delims=" %%i in (exe_list.txt) do copy "%%i" release_assets\
        shell: cmd

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
