name: 🚀 Deploy EBM Central Web (SSH)

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # এটি অটোমেটিক লেটেস্ট স্টেবল ভার্সন নিবে
          cache: true
      - name: 🏗️ Build Web
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_URL=https://api.ebfic.store
      - name: 📤 Upload via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          source: "build/web/*"
          target: "public_html/central"
          strip_components: 2
